<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT.MK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/app.css">
</head><body>
<section class="login" id="login">
  <div class="login-form-lado">
    <form class="login-form" id="form-login">
      <div class="marca"><div class="marca-logo">M</div><div class="marca-nome">IT<span>.</span>MK</div></div>
      <div>
        <h1>Entre na sua conta<span class="ponto-titulo">.</span></h1>
        <p class="sub">Pedidos, notas e anúncios de todos os seus canais em um só lugar.</p>
      </div>
      <div class="campo"><label for="email">E-mail</label><input id="email" type="text" placeholder="voce@suaempresa.com.br" autocomplete="username"></div>
      <div class="campo"><label for="senha">Senha</label>
        <div class="senha-caixa"><input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password"><button type="button" id="ver-senha" class="ver" aria-label="Mostrar senha"><i data-lucide="eye"></i></button></div>
      </div>
      <div class="linha-opcoes"><label class="lembrar"><input type="checkbox" id="lembrar" checked>Manter conectado</label><a href="#" class="link">Esqueci a senha</a></div>
      <button type="submit" class="btn-principal">Entrar<i data-lucide="arrow-right"></i></button>
    </form>
  </div>
  <aside class="login-lado" aria-hidden="true">
    <div class="lado-conteudo">
      <span class="lado-tag"><span class="ponto"></span>Gestão multicanal</span>
      <h2>Todos os marketplaces, uma única tela.</h2>
      <div class="lado-canais">
        <div class="lc"><span class="chip-canal" style="color:var(--ml-t);background:var(--ml-f)">ML</span>Mercado Livre</div>
        <div class="lc"><span class="chip-canal" style="color:var(--sh-t);background:var(--sh-f)">SH</span>Shopee</div>
        <div class="lc"><span class="chip-canal" style="color:var(--am-t);background:var(--am-f)">AM</span>Amazon</div>
        <div class="lc"><span class="chip-canal" style="color:var(--mg-t);background:var(--mg-f)">MG</span>Magalu</div>
      </div>
      <div class="lado-rodape"><span>Pedidos</span><span>Notas</span><span>Anúncios</span><span>Automações</span></div>
    </div>
  </aside>
</section>
<div class="app" id="app" hidden>
  <nav class="menu" id="menu"></nav>
  <div>
    <header class="topo">
      <label class="busca">
        <i data-lucide="search"></i><input id="busca" placeholder="Buscar produto, SKU ou pedido"><kbd>⌘K</kbd>
      </label>
      <div class="topo-dir"><span class="sync"><span class="ponto"></span>Sincronizado agora</span><span class="avatar">MR</span></div>
    </header>
    <main class="tela" id="tela"></main>
  </div>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="js/mock-data.js"></script><script src="app.js"></script>
</body></html>
